description: EXPERIMENTAL approximate draft-only FP8 shortlist with BF16 rescoring;
  no serving validation
name: codex-flashnext-fp8-refine8
model: nvidia/Qwen3.8-Flash-Next-NVFP4
container: flashnext-codex:20260909-fp8-refine8
runtime: vllm-distributed
min_nodes: 2
max_nodes: 2
metadata:
  description: EXPERIMENTAL approximate draft-only FP8 shortlist with BF16 rescoring;
    no serving validation
  model_dtype: nvfp4
  quantization: nvfp4
defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 2
  gpu_memory_utilization: 0.7
  served_model_name: qwen3.8-flash-next
  revision: fc694b54fb0174e0913e6adf86691ef85a4ead47
  max_model_len: 262144
  max_num_seqs: 6
  max_num_batched_tokens: 4096
  num_speculative_tokens: 3
executor_config:
  entrypoint: ''
  cap_add:
  - SYS_PTRACE
  - IPC_LOCK
  shm_size: 32gb
env:
  HF_HUB_OFFLINE: '1'
  TRANSFORMERS_OFFLINE: '1'
  VLLM_ENGINE_READY_TIMEOUT_S: '3600'
  PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
  CUTE_DSL_ARCH: sm_121a
  TORCH_CUDA_ARCH_LIST: 12.1a
  FLASHINFER_CUDA_ARCH_LIST: 12.1a
  FLASHINFER_DISABLE_VERSION_CHECK: '1'
  VLLM_USE_DEEP_GEMM: '0'
  VLLM_USE_V2_MODEL_RUNNER: '1'
  NCCL_NET: IB
  NCCL_IB_DISABLE: '0'
  NCCL_IB_GID_INDEX: '3'
  NCCL_IB_ROCE_VERSION_NUM: '2'
  NCCL_IB_ADDR_FAMILY: AF_INET
  NCCL_NVLS_ENABLE: '0'
  NCCL_CROSS_NIC: '0'
  NCCL_IB_MERGE_NICS: '0'
  NCCL_CUMEM_ENABLE: '0'
  NCCL_IGNORE_CPU_AFFINITY: '1'
  NCCL_DEBUG: WARN
  TORCH_NCCL_ASYNC_ERROR_HANDLING: '1'
  VLLM_HTTP_TIMEOUT_KEEP_ALIVE: '600'
  NCCL_IB_HCA: rocep1s0f1,roceP2p1s0f1
  NCCL_IB_ADDR_RANGE: 192.168.100.0/24
  NCCL_SOCKET_IFNAME: enp1s0f1np1
  GLOO_SOCKET_IFNAME: enp1s0f1np1
  TP_SOCKET_IFNAME: enp1s0f1np1
  MN_IF_NAME: enp1s0f1np1
command: |
  vllm serve {model} \
    --revision {revision} \
    --served-model-name {served_model_name} \
    --host {host} \
    --port {port} \
    --trust-remote-code \
    --quantization modelopt \
    --tensor-parallel-size {tensor_parallel} \
    --max-model-len {max_model_len} \
    --max-num-seqs {max_num_seqs} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --no-enable-flashinfer-autotune \
    --enable-prefix-caching \
    --reasoning-parser qwen3 \
    --enable-auto-tool-choice \
    --tool-call-parser qwen3_xml \
    --default-chat-template-kwargs '{{"enable_thinking": false}}' \
    --speculative-config '{{"method":"mtp","num_speculative_tokens":{num_speculative_tokens},"disable_eagle_block_drop":true,"use_local_argmax_reduction":true}}' \
    --compilation-config '{{"mode":0,"cudagraph_mode":"FULL_DECODE_ONLY"}}' \
    --kv-cache-dtype fp8_e4m3 \
    --enable-expert-parallel \
    --all2all-backend allgather_reducescatter
recipe_version: '1'
builder: ursuciprian
