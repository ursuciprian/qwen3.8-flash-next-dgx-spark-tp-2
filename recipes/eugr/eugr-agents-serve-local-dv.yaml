# Lever 1 arm: eugr-agents-serve-local.yaml + reduced-vocab MTP draft head.
# Requires vllm-0001-mtp-draft-vocab.patch applied to ~/GEN-AI/build/vllm and
# rebuilt (VLLM_QWEN_MTP_DRAFT_VOCAB_PATH needs the wiring the patch adds --
# without it this recipe boots on plain use_local_argmax_reduction, which is
# communication-only, not the weight-read saving).
#
# Prereqs before first boot on this recipe:
#   1. git apply ~/GEN-AI/build/patches/vllm-0001-mtp-draft-vocab.patch (in
#      ~/GEN-AI/build/vllm), then ~/GEN-AI/build/build.sh (new local tag).
#   2. Table: ~/GEN-AI/build/draft-vocab/draft_vocab_mia47k.pt (MiaAI-Lab's
#      published 47k-id table for this tokenizer, converted to our .pt format
#      -- see build/draft-vocab/README.md for provenance/coverage/AGPL note.
#      Our own 12.6k table was corpus-limited/trivial-coverage; not shipped.)
#   3. Mount: the recipe schema has no `volumes:` field -- run-recipe.py takes
#      host mounts via `-v host:container` on the CLI. Boot with:
#        -v $HOME/GEN-AI/build/draft-vocab:/home/nvidia/GEN-AI/build/draft-vocab
#      on every cluster host so the container path below resolves. (No
#      existing recipe host-mounts a runtime path this way -- /cache/runtime
#      seen in serve logs is the container's own internal torch-compile cache
#      dir, not a host mount; this -v flag is new, not an established pattern.)
#   4. Update `container:` to the new build tag.
#
# Expected gain: +8-21% single-stream decode (MiaAI-Lab measurement on this
# model family, hand-rolled equivalent mechanism). Source: kernel-sweep
# 2026-09-18 §4 / MiaAI-Lab/Qwen3.8-Flash-Next-Dual-DGX-Sparks. Unverified on
# our stack -- this is the A/B arm, not a claimed result.
#
# Quality gate (must hold before promoting over eugr-agents-serve-local):
#   - scripts/fidelity_probe.py 100% exact at 8k/16k/62k/123k/245k (same as
#     the 2026-09-17 baseline gate -- a reduced draft vocab can only lower
#     MTP acceptance, never change accepted output, since every draft token
#     is still verified by the full-vocab target model; a regression here
#     would mean the D2T remap itself is wrong, not an acceptance-rate cost).
#   - tool-eval hardmode within 86-93 (today's baseline noise band, see
#     project-qwen-verdicts-2026-09-17.md -- do not rank on one run).
#   - needle recall unchanged at every probed depth.
#   - MTP acceptance % printed in the serve log must not be WORSE than the
#     61% cumulative / 81-62-48-37% per-position baseline by more than noise;
#     if it drops, the vocab table's coverage (see build_draft_vocab.py
#     output) is too low for --size and needs a bigger table, not a revert
#     of the mechanism.
#
# One-boot A/B: boot this recipe once, run Tony's 40-prompt single-stream
# harness + fidelity_probe.py + one tool-eval hardmode run, compare against
# the eugr-agents-serve-local.yaml baseline from the same image otherwise
# unchanged (container tag differs only by this patch).

recipe_version: "1"
name: eugr-agents-serve-local-dv
description: "LOCAL BUILD ARM + reduced-vocab MTP draft head (vllm-0001-mtp-draft-vocab.patch, LocalArgmaxMixin wiring). Update container: to the patched build's tag."

model: local-inference-lab/Qwen3.8-Flash-Next-NVFP4
container: spark-vllm-b12x:local-20260918-a8333658-dv

build_args: []

cluster_only: true

mods:
  - vllm-dv-devicefix  # runtime device fix for the register_buffer torch.arange bug; fold into the source patch + rebuild once promoted

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 2
  pipeline_parallel: 1
  block_size: 16
  max_model_len: 262144
  max_num_seqs: 16
  max_num_batched_tokens: 8192
  num_speculative_tokens: 4
  gpu_memory_utilization: 0.80

env:
  B12X_AUTOTUNE: "1"
  CUTE_DSL_ARCH: "sm_121a"
  SAFETENSORS_FAST_GPU: "1"
  VLLM_WORKER_MULTIPROC_METHOD: "spawn"
  VLLM_SSM_CONV_STATE_LAYOUT: "DS"
  VLLM_USE_AOT_COMPILE: "1"
  VLLM_USE_MEGA_AOT_ARTIFACT: "1"
  VLLM_USE_V2_MODEL_RUNNER: "1"
  B12X_POLICY_MODE: "auto"
  VLLM_ENABLE_ROCE_ALLREDUCE: "1"
  VLLM_ROCE_ALLREDUCE_MAX_SIZE: "2MB"
  # Lever 1: reduced-vocab MTP draft head, MiaAI-Lab 47k table (see prereq 2/3
  # above for mount + provenance). Path is inside the container.
  VLLM_QWEN_MTP_DRAFT_VOCAB_PATH: "/opt/draft-vocab/draft_vocab_mia47k.pt"

command: |
  vllm serve local-inference-lab/Qwen3.8-Flash-Next-NVFP4 \
    --host {host} \
    --port {port} \
    --trust-remote-code \
    --served-model-name qwen3.8-flash-next local-inference-lab/Qwen3.8-Flash-Next-NVFP4 \
    --tensor-parallel-size {tensor_parallel} \
    --pipeline-parallel-size {pipeline_parallel} \
    --mamba-cache-mode align \
    --enable-prefix-caching \
    --enable-chunked-prefill \
    --max-parallel-prefills 4 \
    --prefill-policy decode-aware \
    --decode-refill-target auto \
    --dtype bfloat16 \
    --kv-cache-dtype fp8 \
    --quantization modelopt_mixed \
    --block-size {block_size} \
    --load-format b12x \
    --max-model-len {max_model_len} \
    --max-num-seqs {max_num_seqs} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --speculative-config '{{"method":"mtp","num_speculative_tokens":{num_speculative_tokens},"use_local_argmax_reduction":true}}' \
    --gdn-decode-kernel b12x \
    --linear-backend b12x \
    --moe-backend b12x \
    --no-enable-flashinfer-autotune \
    --mm-encoder-tp-mode data \
    --reasoning-parser qwen3 \
    --tool-call-parser qwen3_xml \
    --enable-auto-tool-choice \
    --compilation-config '{{"pass_config":{{"fuse_act_quant":true}}}}' \
    --gpu-memory-utilization {gpu_memory_utilization}
