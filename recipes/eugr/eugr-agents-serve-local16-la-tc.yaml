# eugr/spark-vllm-docker recipes/qwen3.8-flash-next-nvfp4-cluster.yaml, copied 2026-09-15 (repo 3e1578b) as the bisect baseline.
# Measured on eugr's image 2026-09-15 with scripts/decode_probe.py (c1, streaming, temp 0,
# 512 max tokens, fresh context): structured 113, prose 53 tok/s on the first boot only;
# later boots structured 70-85, prose 43-47. tool-eval short 100/100. results/eugr-b12x/RESULTS.md.

recipe_version: "1"
name: eugr-agents-serve-local16-la-tc
description: "la + vllm-tc45-reasoning-structag-fix mod: tool_choice=required/named structural-tag enforcement now passes reasoning=True (was hardcoded False), so the forced-tool-call grammar admits the <think> prefix this recipe's --reasoning-parser qwen3 always emits. Fixes tool-eval-bench TC-45 ('tool_choice=required Compliance'). See results/arms/tooleval-fix/notes.md."

model: local-inference-lab/Qwen3.8-Flash-Next-NVFP4
container: spark-vllm-b12x:local-20260918-a8333658

# Empty on purpose. Any token here (including --exp-b12x) makes sparkrun's
# eugr builder either substitute its own pullable nightly or try to build via
# build-and-copy.sh (sparkrun/builders/eugr.py: _wants_build()/_wants_b12x()) --
# both wrong for a tag build.sh already built and loaded on every cluster host.
# With build_args empty and a non-sentinel tag already present on all hosts,
# sparkrun's pull-first-default branch just uses it verbatim.
build_args: []

cluster_only: true

mods:
  - vllm-tc45-reasoning-structag-fix

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 2
  pipeline_parallel: 1
  block_size: 16
  max_model_len: 262144
  max_num_seqs: 16
  max_num_batched_tokens: 8192
  num_speculative_tokens: 4
  gpu_memory_utilization: 0.80

env:
  B12X_AUTOTUNE: "1"
  CUTE_DSL_ARCH: "sm_121a"
  SAFETENSORS_FAST_GPU: "1"
  VLLM_WORKER_MULTIPROC_METHOD: "spawn"
  VLLM_SSM_CONV_STATE_LAYOUT: "DS"
  VLLM_USE_AOT_COMPILE: "1"
  VLLM_USE_MEGA_AOT_ARTIFACT: "1"
  VLLM_USE_V2_MODEL_RUNNER: "1"
  B12X_POLICY_MODE: "auto"
  VLLM_ENABLE_ROCE_ALLREDUCE: "1"
  VLLM_ROCE_ALLREDUCE_MAX_SIZE: "2MB"

command: |
  vllm serve local-inference-lab/Qwen3.8-Flash-Next-NVFP4 \
    --host {host} \
    --port {port} \
    --trust-remote-code \
    --served-model-name qwen3.8-flash-next local-inference-lab/Qwen3.8-Flash-Next-NVFP4 \
    --tensor-parallel-size {tensor_parallel} \
    --pipeline-parallel-size {pipeline_parallel} \
    --mamba-cache-mode align \
    --enable-prefix-caching \
    --enable-chunked-prefill \
    --max-parallel-prefills 4 \
    --prefill-policy decode-aware \
    --decode-refill-target auto \
    --dtype bfloat16 \
    --kv-cache-dtype fp8 \
    --quantization modelopt_mixed \
    --block-size {block_size} \
    --load-format b12x \
    --max-model-len {max_model_len} \
    --max-num-seqs {max_num_seqs} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --speculative-config '{{"method":"mtp","num_speculative_tokens":{num_speculative_tokens},"use_local_argmax_reduction":true}}' \
    --gdn-decode-kernel b12x \
    --linear-backend b12x \
    --moe-backend b12x \
    --no-enable-flashinfer-autotune \
    --mm-encoder-tp-mode data \
    --reasoning-parser qwen3 \
    --tool-call-parser qwen3_xml \
    --enable-auto-tool-choice \
    --compilation-config '{{"pass_config":{{"fuse_act_quant":true}}}}' \
    --gpu-memory-utilization {gpu_memory_utilization}
