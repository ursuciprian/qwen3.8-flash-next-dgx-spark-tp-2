# Lever 3 arm: eugr-agents-serve-local.yaml + --mamba-ssm-cache-dtype bfloat16.
#
# NOT a source patch -- see misc/gdn-state-bf16-lever3-2026-09-18.md for the
# full file:line trace. Short version: the 2026-09-17
# `MAMBA_SSM_CACHE_DTYPE=bfloat16` env-var arm had "no effect" because that
# env var doesn't exist in vllm/envs.py and was never read by anything --
# not because the b12x GDN path ignores state dtype. The real knob is the
# CLI flag below; get_state_dtype() -> MambaStateDtypeCalculator ->
# b12x Caps.state_dtype -> recurrent_state tensor allocation and the fused
# decode kernel's FUSED_GDN_STATE_DTYPES gate all already support BF16.
# Same container tag as the baseline -- zero rebuild.
#
# Expected gain: MiaAI-Lab measured +8.5% at 8 concurrent streams on stock
# vLLM (not our b12x/TP2/RoCE stack) -- a prior, not a promise; re-measure.
#
# Quality gate: fidelity_probe.py 100% exact at 128k (not just 8k-123k),
# needle_ladder.py at 64k unchanged vs the float32-state baseline, tool-eval
# hardmode within 86-93, MTP acceptance not below 61% cumulative / 81-62-48-37
# per-position (a state-precision regression shows up as acceptance drop
# before visible output error, since every draft is re-verified).
#
# One-boot A/B: boot this recipe once; run the same battery as
# eugr-agents-serve-local.yaml (Tony 40-prompt single-stream, concurrency
# sweep c1/c4/c5-c8, fidelity_probe 128k, needle_ladder 64k, one tool-eval
# hardmode run) and diff against the 2026-09-17 baseline numbers. Revert by
# setting the flag back to `auto` (or removing it) -- no rebuild either way.

recipe_version: "1"
name: eugr-agents-serve-local-gdnbf16
description: "LOCAL BUILD ARM + --mamba-ssm-cache-dtype bfloat16 (GDN recurrent state in BF16). Flag-only, same container as eugr-agents-serve-local.yaml."

model: local-inference-lab/Qwen3.8-Flash-Next-NVFP4
container: spark-vllm-b12x:local-20260918-a8333658

build_args: []

cluster_only: true

mods: []

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 2
  pipeline_parallel: 1
  block_size: 16
  max_model_len: 262144
  max_num_seqs: 8
  max_num_batched_tokens: 8192
  num_speculative_tokens: 4
  gpu_memory_utilization: 0.80

env:
  CUTE_DSL_ARCH: "sm_121a"
  SAFETENSORS_FAST_GPU: "1"
  VLLM_WORKER_MULTIPROC_METHOD: "spawn"
  VLLM_SSM_CONV_STATE_LAYOUT: "DS"
  VLLM_USE_AOT_COMPILE: "1"
  VLLM_USE_MEGA_AOT_ARTIFACT: "1"
  VLLM_USE_V2_MODEL_RUNNER: "1"
  B12X_POLICY_MODE: "auto"
  VLLM_ENABLE_ROCE_ALLREDUCE: "1"
  VLLM_ROCE_ALLREDUCE_MAX_SIZE: "2MB"

command: |
  vllm serve local-inference-lab/Qwen3.8-Flash-Next-NVFP4 \
    --host {host} \
    --port {port} \
    --trust-remote-code \
    --served-model-name qwen3.8-flash-next local-inference-lab/Qwen3.8-Flash-Next-NVFP4 \
    --tensor-parallel-size {tensor_parallel} \
    --pipeline-parallel-size {pipeline_parallel} \
    --mamba-cache-mode align \
    --mamba-ssm-cache-dtype bfloat16 \
    --enable-prefix-caching \
    --enable-chunked-prefill \
    --max-parallel-prefills 4 \
    --prefill-policy decode-aware \
    --decode-refill-target auto \
    --dtype bfloat16 \
    --kv-cache-dtype fp8 \
    --quantization modelopt_mixed \
    --block-size {block_size} \
    --load-format b12x \
    --max-model-len {max_model_len} \
    --max-num-seqs {max_num_seqs} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --speculative-config '{{"method":"mtp","num_speculative_tokens":{num_speculative_tokens}}}' \
    --gdn-decode-kernel b12x \
    --linear-backend b12x \
    --moe-backend b12x \
    --no-enable-flashinfer-autotune \
    --mm-encoder-tp-mode data \
    --reasoning-parser qwen3 \
    --tool-call-parser qwen3_xml \
    --enable-auto-tool-choice \
    --compilation-config '{{"pass_config":{{"fuse_act_quant":true}}}}' \
    --gpu-memory-utilization {gpu_memory_utilization}
