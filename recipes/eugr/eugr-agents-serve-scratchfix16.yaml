# eugr/spark-vllm-docker recipes/qwen3.8-flash-next-nvfp4-cluster.yaml, copied 2026-09-15 (repo 3e1578b) as the bisect baseline.
# Measured here: structured 113, prose 53-55 tok/s at temp 0, tool-eval 100/100.

recipe_version: "1"
name: eugr-agents-serve-scratchfix16
description: "Straggler probe: eugr-agents-serve with max_num_seqs 16 and the vllm-qwen-scratch-isolation mod (98cd717 rebased, disjoint GDN/QSA projection scratch), testing whether shared projection scratch explains the c5/c9/c12 MTP draft-acceptance straggler."

model: local-inference-lab/Qwen3.8-Flash-Next-NVFP4
container: vllm-node-b12x

build_args:
  - --exp-b12x

cluster_only: true

mods: [vllm-qwen-scratch-isolation]

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 2
  pipeline_parallel: 1
  block_size: 16
  max_model_len: 262144
  max_num_seqs: 16
  max_num_batched_tokens: 8192
  num_speculative_tokens: 4
  gpu_memory_utilization: 0.80

env:
  CUTE_DSL_ARCH: "sm_121a"
  SAFETENSORS_FAST_GPU: "1"
  VLLM_WORKER_MULTIPROC_METHOD: "spawn"
  VLLM_SSM_CONV_STATE_LAYOUT: "DS"
  VLLM_USE_AOT_COMPILE: "1"
  VLLM_USE_MEGA_AOT_ARTIFACT: "1"
  VLLM_USE_V2_MODEL_RUNNER: "1"
  B12X_POLICY_MODE: "auto"
  VLLM_ENABLE_ROCE_ALLREDUCE: "1"
  VLLM_ROCE_ALLREDUCE_MAX_SIZE: "2MB"

command: |
  vllm serve local-inference-lab/Qwen3.8-Flash-Next-NVFP4 \
    --host {host} \
    --port {port} \
    --trust-remote-code \
    --served-model-name qwen3.8-flash-next local-inference-lab/Qwen3.8-Flash-Next-NVFP4 \
    --tensor-parallel-size {tensor_parallel} \
    --pipeline-parallel-size {pipeline_parallel} \
    --mamba-cache-mode align \
    --enable-prefix-caching \
    --enable-chunked-prefill \
    --max-parallel-prefills 4 \
    --prefill-policy decode-aware \
    --decode-refill-target auto \
    --dtype bfloat16 \
    --kv-cache-dtype fp8 \
    --quantization modelopt_mixed \
    --block-size {block_size} \
    --load-format b12x \
    --max-model-len {max_model_len} \
    --max-num-seqs {max_num_seqs} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --speculative-config '{{"method":"mtp","num_speculative_tokens":{num_speculative_tokens}}}' \
    --gdn-decode-kernel b12x \
    --linear-backend b12x \
    --moe-backend b12x \
    --no-enable-flashinfer-autotune \
    --mm-encoder-tp-mode data \
    --reasoning-parser qwen3 \
    --tool-call-parser qwen3_xml \
    --enable-auto-tool-choice \
    --compilation-config '{{"pass_config":{{"fuse_act_quant":true}}}}' \
    --gpu-memory-utilization {gpu_memory_utilization}
