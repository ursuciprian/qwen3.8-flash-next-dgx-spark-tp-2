description: Qwen3.8-Flash-Next NVFP4 TP=2 deep-concurrency - chunk 4096, required above 16k at c5
model: RadixArk/Qwen3.8-Flash-Next-NVFP4
container: lmsysorg/sglang:qwen38flashnext
runtime: sglang

min_nodes: 2
max_nodes: 2

metadata:
  description: Qwen3.8-Flash-Next NVFP4 TP=2 balanced - mamba ratio 0.6 for 16 concurrent slots plus KV headroom
  model_dtype: nvfp4
  model_params: '180000000000'

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 2
  gpu_memory_utilization: 0.82
  served_model_name: qwen3.8-flash-next
  revision: 7b719225242aacd3dbd3f9407468c2ee9a9d2594
  quantization: modelopt_fp4
  fp4_gemm_backend: flashinfer_cutlass
  page_size: 64
  mamba_radix_cache_strategy: extra_buffer
  mamba_track_interval: 64
  mamba_full_memory_ratio: 0.6
  chunked_prefill_size: 4096
  max_running_requests: 16
  context_length: 262144
  cuda_graph_max_bs_decode: 16
  speculative_num_steps: 3
  speculative_eagle_topk: 1
  speculative_num_draft_tokens: 4

executor_config:
  cap_add:
    - SYS_PTRACE
  volumes:
    - /home/nvidia/GEN-AI/qwen38-opt/patches/qsa_upstream_fix.py:/sgl-workspace/sglang/python/sglang/srt/layers/attention/qwen_sparse_attn_backend.py:ro

env:
  NCCL_SOCKET_IFNAME: enp1s0f1np1
  GLOO_SOCKET_IFNAME: enp1s0f1np1
  NCCL_NET: IB
  NCCL_IB_DISABLE: '0'
  NCCL_IB_HCA: rocep1s0f1,roceP2p1s0f1
  NCCL_IB_GID_INDEX: '3'
  NCCL_CROSS_NIC: '1'
  NCCL_NVLS_ENABLE: '0'
  NCCL_CUMEM_ENABLE: '0'

command: |
  taskset -c 5-9,15-19 sglang serve \
    --trust-remote-code \
    --model-path {model} \
    --revision {revision} \
    --served-model-name {served_model_name} \
    --tp-size {tensor_parallel} \
    --mem-fraction-static {gpu_memory_utilization} \
    --quantization {quantization} \
    --fp4-gemm-backend {fp4_gemm_backend} \
    --page-size {page_size} \
    --mamba-radix-cache-strategy {mamba_radix_cache_strategy} \
    --mamba-track-interval {mamba_track_interval} \
    --mamba-full-memory-ratio {mamba_full_memory_ratio} \
    --chunked-prefill-size {chunked_prefill_size} \
    --speculative-attention-mode decode \
    --context-length {context_length} \
    --max-running-requests {max_running_requests} \
    --disable-flashinfer-autotune \
    --disable-prefill-cuda-graph \
    --cuda-graph-max-bs-decode {cuda_graph_max_bs_decode} \
    --speculative-algorithm NEXTN \
    --speculative-num-steps {speculative_num_steps} \
    --speculative-eagle-topk {speculative_eagle_topk} \
    --speculative-num-draft-tokens {speculative_num_draft_tokens} \
    --language-only \
    --allow-auto-truncate \
    --enable-metrics \
    --host {host} \
    --port {port}

recipe_version: '1'
builder: ursuciprian
