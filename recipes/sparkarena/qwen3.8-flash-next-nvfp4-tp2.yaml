# Image pinned by digest 2026-09-09 (the qwen38-flash-next build of 2026-08-26).
description: Qwen3.8-Flash-Next NVFP4 on vLLM TP=2 - mode 0 (no inductor compile) + FULL_DECODE_ONLY graphs at bs 1-4
model: RadixArk/Qwen3.8-Flash-Next-NVFP4
name: qwen3.8-flash-next-nvfp4-tp2
container: vllm/vllm-openai@sha256:fc120ece0a388cc0aa1caad4a9f1cd92113484ab7ec2fd0efadd62585be05bf8
runtime: vllm-distributed

min_nodes: 2
max_nodes: 2

metadata:
  description: Qwen3.8-Flash-Next NVFP4 on vLLM TP=2 - mode 0 (no inductor compile) + FULL_DECODE_ONLY graphs at bs 1-4
  model_dtype: nvfp4
  model_params: '180000000000'

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 2
  gpu_memory_utilization: 0.70
  served_model_name: qwen3.8-flash-next
  revision: 7b719225242aacd3dbd3f9407468c2ee9a9d2594
  max_model_len: 262144
  max_num_seqs: 8
  max_num_batched_tokens: 8192
  num_speculative_tokens: 3

mods:
  - vllm-ple-fp8

executor_config:
  entrypoint: ''
  cap_add:
    - SYS_PTRACE

env:
  VLLM_PLE_CPU_OFFLOAD: '0'
  VLLM_PLE_FP8_CHECKPOINT: '1'
  TORCH_CUDA_ARCH_LIST: 12.1f
  CUTE_DSL_ARCH: sm_121a
  FLASHINFER_CUDA_ARCH_LIST: 12.1a
  FLASHINFER_DISABLE_VERSION_CHECK: '1'
  VLLM_HTTP_TIMEOUT_KEEP_ALIVE: '600'
  NCCL_SOCKET_IFNAME: enp1s0f1np1
  GLOO_SOCKET_IFNAME: enp1s0f1np1
  NCCL_IB_DISABLE: '0'
  NCCL_IB_HCA: rocep1s0f1,roceP2p1s0f1
  NCCL_IB_GID_INDEX: '3'
  NCCL_CROSS_NIC: '1'

command: |
  taskset -c 5-9,15-19 vllm serve {model} \
    --revision {revision} \
    --served-model-name {served_model_name} \
    --host {host} \
    --port {port} \
    --tensor-parallel-size {tensor_parallel} \
    --trust-remote-code \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --max-model-len {max_model_len} \
    --max-num-seqs {max_num_seqs} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --kv-cache-dtype auto \
    --enable-prefix-caching \
    --language-model-only \
    --compilation-config '{{"mode":0,"cudagraph_mode":"FULL_DECODE_ONLY","cudagraph_capture_sizes":[1,2,3,4]}}' \
    --no-enable-flashinfer-autotune \
    --speculative-config '{{"method":"mtp","num_speculative_tokens":{num_speculative_tokens}}}' \
    --enable-auto-tool-choice \
    --tool-call-parser qwen3_coder \
    --reasoning-parser qwen3

recipe_version: '1'
builder: docker-pull
