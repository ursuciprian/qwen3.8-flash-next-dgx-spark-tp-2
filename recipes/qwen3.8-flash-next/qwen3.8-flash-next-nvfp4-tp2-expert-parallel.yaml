# formerly eugr-agents-serve-local-ep.yaml
# Lever 2 arm: qwen3.8-flash-next-nvfp4-tp2-local-build.yaml + --enable-expert-parallel.
#
# STATUS: NOT EXPECTED TO WORK on this stack as of 2026-09-18. Do not boot
# this recipe expecting a clean start; boot it only to confirm the failure
# mode, or after the b12x MoE backend gains NVFP4 EP support.
#
# Evidence (dgx-01 clones, fork vLLM 8e1f1e587 + b12x a833365, same tips as
# our local image):
#   - docs/features/quantization/b12x.md (in ~/GEN-AI/build/vllm), line 92,
#     states flatly: "b12x MoE backend does not support expert parallelism,
#     expert maps, EXL3, or NF3."
#   - b12x/moe/ep_moe/_impl.py DOES have a real EP implementation
#     (EPMoEFP4Binding, despite the FP4-sounding class name) but its
#     __post_init__ hard-requires `"w4a16" in self.weight_plan.quant_modes`
#     ("replicated-input EP requires a W4A16 weight plan") and BF16
#     activations. Zero matches for "nvfp4"/"modelopt_mixed" anywhere under
#     b12x/moe/ep_moe/. Our checkpoint is NVFP4 via --quantization
#     modelopt_mixed -- outside this EP path's supported quant modes.
#   - --enable-expert-parallel itself is a real, generic vLLM flag
#     (vllm/config/parallel.py:165, vllm/engine/arg_utils.py:1239) that would
#     be accepted by argument parsing; the failure (if any) happens inside
#     the b12x MoE backend's dispatch/preparation path, not at CLI parse
#     time. Not traced further within this prep task's budget -- expect
#     either an explicit b12x error at MoE layer construction, or (worse,
#     unconfirmed) a silent fallback to TP-replicated MoE that would make
#     --enable-expert-parallel a no-op. Verify which one actually happens
#     before trusting any number from this arm.
#   - This CONTRADICTS the brief's premise that "MiaAI-Lab's dual-Spark
#     recipe runs TP2+EP" for this model family. Not reconciled here --
#     either MiaAI is on a different b12x revision/fork with W4A16 experts
#     (a different checkpoint quantization than ours), or on an older/newer
#     b12x that added NVFP4 EP support after a833365 (2026-09-17, confirmed
#     current tip as of this write-up). Re-check b12x.md and ep_moe/*.py
#     after any b12x upgrade before retrying this lever.
#
# Risks if it DID work (kept for when/if NVFP4 EP lands in b12x):
#   - All-to-all dispatch/combine cost across CX7 RoCE replaces the current
#     per-layer all-reduce; whether that's a net win depends on RoCE
#     bandwidth vs. the MoE all-reduce we're removing -- unmeasured for our
#     2-node/TP2 topology, could go either way at only 2 ranks (EP's payoff
#     usually grows with rank count; at ranks=2 the win over TP is smaller).
#   - Load imbalance: 10-of-512 expert routing is a sparse, learned
#     distribution: with only 2 EP ranks (256 experts/rank) a token batch
#     skewed toward one rank's expert shard stalls the other rank, same
#     straggler shape as the open c5-c7 MTP bug but from ep_moe's kernel
#     stack (EPExpertMap and EPMoEScratchCaps allocation) instead.
#   - Memory per rank: EP moves expert weight residency onto fewer GPUs per
#     shard, changing the KV-cache headroom math the 2026-09-17 verdicts
#     tuned gpu_memory_utilization=0.80 around (host MemAvailable was as low
#     as 35 MB on dgx-02) -- would need a fresh memory-headroom check, not
#     assumed same as TP2.
#
# Expected gain: none claimed here (see STATUS). If MiaAI's dual-Spark
# repo's method is confirmed reproducible on a W4A16 checkpoint variant of
# this model, their number would need re-measuring against our own NVFP4
# QAD baseline, not carried over.
#
# Quality gate (if this ever boots successfully): identical to lever 1 --
# fidelity_probe.py 100% exact 8k-128k, tool-eval hardmode 86-93, needle
# recall unchanged. EP changes routing/execution, not weight values, so
# any quality delta at all is a bug, not a tradeoff.

recipe_version: "1"
name: qwen3.8-flash-next-nvfp4-tp2-expert-parallel
description: "LOCAL BUILD ARM + --enable-expert-parallel. NOT EXPECTED TO WORK: b12x MoE backend's EP path is W4A16-only per docs/features/quantization/b12x.md; our checkpoint is NVFP4. Boot only to confirm the failure mode."

model: local-inference-lab/Qwen3.8-Flash-Next-NVFP4
model_revision: 7c4f1bc1a2d6847e0cbc01ac6b823f00251de8dd
container: spark-vllm-b12x:local-20260918-a8333658

build_args: []

cluster_only: true

mods: []

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 2
  pipeline_parallel: 1
  block_size: 16
  max_model_len: 262144
  max_num_seqs: 8
  max_num_batched_tokens: 8192
  num_speculative_tokens: 4
  gpu_memory_utilization: 0.80

env:
  CUTE_DSL_ARCH: "sm_121a"
  SAFETENSORS_FAST_GPU: "1"
  VLLM_WORKER_MULTIPROC_METHOD: "spawn"
  VLLM_SSM_CONV_STATE_LAYOUT: "DS"
  VLLM_USE_AOT_COMPILE: "1"
  VLLM_USE_MEGA_AOT_ARTIFACT: "1"
  VLLM_USE_V2_MODEL_RUNNER: "1"
  B12X_POLICY_MODE: "auto"
  VLLM_ENABLE_ROCE_ALLREDUCE: "1"
  VLLM_ROCE_ALLREDUCE_MAX_SIZE: "2MB"

command: |
  vllm serve local-inference-lab/Qwen3.8-Flash-Next-NVFP4 \
    --revision 7c4f1bc1a2d6847e0cbc01ac6b823f00251de8dd \
    --host {host} \
    --port {port} \
    --trust-remote-code \
    --served-model-name qwen3.8-flash-next local-inference-lab/Qwen3.8-Flash-Next-NVFP4 \
    --tensor-parallel-size {tensor_parallel} \
    --pipeline-parallel-size {pipeline_parallel} \
    --enable-expert-parallel \
    --mamba-cache-mode align \
    --enable-prefix-caching \
    --enable-chunked-prefill \
    --max-parallel-prefills 4 \
    --prefill-policy decode-aware \
    --decode-refill-target auto \
    --dtype bfloat16 \
    --kv-cache-dtype fp8 \
    --quantization modelopt_mixed \
    --block-size {block_size} \
    --load-format b12x \
    --max-model-len {max_model_len} \
    --max-num-seqs {max_num_seqs} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --speculative-config '{{"method":"mtp","num_speculative_tokens":{num_speculative_tokens}}}' \
    --gdn-decode-kernel b12x \
    --linear-backend b12x \
    --moe-backend b12x \
    --no-enable-flashinfer-autotune \
    --mm-encoder-tp-mode data \
    --reasoning-parser qwen3 \
    --tool-call-parser qwen3_xml \
    --enable-auto-tool-choice \
    --compilation-config '{{"pass_config":{{"fuse_act_quant":true}}}}' \
    --gpu-memory-utilization {gpu_memory_utilization}
