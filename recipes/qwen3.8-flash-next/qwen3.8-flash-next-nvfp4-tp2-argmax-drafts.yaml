# formerly eugr-agents-serve-local16-la-argmax.yaml
# Fallback: the previous default (one-hot MTP drafts + use_local_argmax_reduction),
# superseded 2026-09-22 by probabilistic drafts in qwen3.8-flash-next-nvfp4-tp2.yaml.
# Use it for clients that always send temperature 0 (greedy), or to roll back.
# 2026-09-23: repackaged onto the default's warm ghcr image (same a8333658 build
# with the bounded-wait fix and b12x plan seed baked in), so it needs no mods,
# no --trust and no host mounts. Identical to the default except `name`,
# `description` and the --speculative-config line. Served on the local
# a8333658 image + b12x-startup-boundedwait mod until 2026-09-22 (arm la-lmq,
# 2026-09-21, bench_sweep counting diagnostic, temp 0, thinking off: c1 median
# 99.5 / max 101.8, c8 440.7 tok/s). Not boot-tested on the warm image yet.
# The original local-image copy is archive/recipes/qwen3.8-flash-next/
# qwen3.8-flash-next-nvfp4-tp2-argmax-drafts-local.yaml.

recipe_version: "1"
name: qwen3.8-flash-next-nvfp4-tp2-argmax-drafts
description: "Fallback: previous default, one-hot MTP drafts with use_local_argmax_reduction (best for temperature-0 clients); same warm ghcr image as qwen3.8-flash-next-nvfp4-tp2."

model: local-inference-lab/Qwen3.8-Flash-Next-NVFP4
# Pinned twice on purpose: model_revision drives sparkrun's download and cache
# key, and --revision in the command pins what each rank loads (sparkrun runs
# vLLM offline, so each node would otherwise follow its own refs/main;
# docs/ENGINEERING.md known issues).
model_revision: 7c4f1bc1a2d6847e0cbc01ac6b823f00251de8dd
# B0 image (a8333658 build of 2026-09-18) plus docker/b0-warm: the b12x plan
# cache seed and the startup bounded-wait patch baked in, so this recipe needs
# no mods, no --trust and no host mounts. Base without the warm layer:
# spark-vllm-b12x:local-20260918-a8333658 (use it with archive/mods/
# b12x-startup-boundedwait).
# Digest of this tag: sha256:a3d5d90d1312edc9a79c86add6fdf72d50b2a73558e295fdf4ea110488fb615d
# (arm64, public). Kept as a tag on purpose: sparkrun 0.3.6 copies the image
# head->worker with `docker save | docker load`, which drops RepoDigests, so a
# repo@sha256 reference never matches on the worker (containers/distribute.py
# identity check). Every run would re-transfer the image and then pull it again
# from ghcr on the worker.
container: ghcr.io/ursuciprian/spark-vllm-b12x:b0-20260918-a8333658-warm
runtime: vllm

# Empty on purpose. Any token here (including --exp-b12x) makes sparkrun's
# eugr builder either substitute its own pullable nightly or try to build via
# build-and-copy.sh (sparkrun/builders/eugr.py: _wants_build()/_wants_b12x()) --
# both wrong for a tag build.sh already built and loaded on every cluster host.
# With build_args empty and a non-sentinel tag already present on all hosts,
# sparkrun's pull-first-default branch just uses it verbatim.
build_args: []

cluster_only: true
min_nodes: 2
max_nodes: 2

# Caches: sparkrun mounts ~/.cache/sparkrun/runtime-cache/vllm/<model>-<hash>
# at /cache/runtime and sets XDG_CACHE_HOME there (core/runtime_cache.py).
# b12x, triton, inductor, flashinfer and vLLM's compile cache all persist in
# it, so the recipe needs no volumes (and sparkrun ignores `volumes` from an
# untrusted registry recipe anyway). The first line of `command` seeds the
# b12x plan-selection cache from the image; see docker/b0-warm/Dockerfile.

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 2
  pipeline_parallel: 1
  block_size: 16
  max_model_len: 262144
  max_num_seqs: 16
  max_num_batched_tokens: 8192
  num_speculative_tokens: 4
  gpu_memory_utilization: 0.80

env:
  B12X_AUTOTUNE: "1"
  B12X_ROCE_SPIN_LIMIT: "300000000"
  CUTE_DSL_ARCH: "sm_121a"
  SAFETENSORS_FAST_GPU: "1"
  VLLM_WORKER_MULTIPROC_METHOD: "spawn"
  VLLM_SSM_CONV_STATE_LAYOUT: "DS"
  VLLM_USE_AOT_COMPILE: "1"
  VLLM_USE_MEGA_AOT_ARTIFACT: "1"
  VLLM_USE_V2_MODEL_RUNNER: "1"
  B12X_POLICY_MODE: "auto"
  VLLM_ENABLE_ROCE_ALLREDUCE: "1"
  VLLM_ROCE_ALLREDUCE_MAX_SIZE: "2MB"
  # verify-head lm_head (124160x2560 BF16) ran on cuBLAS every decode step
  # because b12x's BF16 vocab projection only has a kernel for M=1: 636 MB
  # read per step, 3.6 ms = 6.5% of the 55 ms c1 step. Online MXFP8 (W8A16,
  # Mxfp8OnlineLinearMethod(use_a16=True), activations stay BF16) halves the
  # bytes read. Measured 2026-09-21 (arm la-lmq, 6 sweeps each, same boot
  # night) on the bench_sweep counting diagnostic (list 1-300, temp 0,
  # thinking off, 320 tokens, fresh context, aggregate tok/s; a spec-decode
  # ceiling, not coding speed): c1 median 99.5 / max 101.8 tok/s vs baseline
  # 95.6 / 99.5, c8 440.7 vs 433.0, gate sweep c1 100.6 / c4 293.7 / c8 454.7 /
  # c16 645.1; hardmode
  # 89/100 (la band 86-93), fidelity 8k-128k 20/20 x4, straggler c5-16 clean
  # at 3.98-3.99 accepted/draft. MTP draft head is already NVFP4
  # (VLLM_MTP_NVFP4_LM_HEAD default 1) -- both heads are now quantized.
  VLLM_MXFP8_LM_HEAD: "1"

# --speculative-config: one-hot drafts + use_local_argmax_reduction (the
# default before 2026-09-22). At temperature 1.0 one-hot drafts only get ~0.27
# accepted per draft token; see the default recipe for the measurements.
command: |
  S=/opt/b12x-seed/preparation; D="$XDG_CACHE_HOME/b12x/compile/preparation"; if [ -d "$S" ] && [ -n "$XDG_CACHE_HOME" ]; then mkdir -p "$D" && for f in "$S"/*.json; do [ -e "$D/$(basename "$f")" ] || cp "$f" "$D/"; done; fi
  vllm serve local-inference-lab/Qwen3.8-Flash-Next-NVFP4 \
    --revision 7c4f1bc1a2d6847e0cbc01ac6b823f00251de8dd \
    --host {host} \
    --port {port} \
    --trust-remote-code \
    --served-model-name qwen3.8-flash-next local-inference-lab/Qwen3.8-Flash-Next-NVFP4 \
    --tensor-parallel-size {tensor_parallel} \
    --pipeline-parallel-size {pipeline_parallel} \
    --mamba-cache-mode align \
    --enable-prefix-caching \
    --enable-chunked-prefill \
    --max-parallel-prefills 4 \
    --prefill-policy decode-aware \
    --decode-refill-target auto \
    --dtype bfloat16 \
    --kv-cache-dtype fp8 \
    --quantization modelopt_mixed \
    --block-size {block_size} \
    --load-format b12x \
    --max-model-len {max_model_len} \
    --max-num-seqs {max_num_seqs} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --speculative-config '{{"method":"mtp","num_speculative_tokens":{num_speculative_tokens},"use_local_argmax_reduction":true}}' \
    --gdn-decode-kernel b12x \
    --linear-backend b12x \
    --moe-backend b12x \
    --no-enable-flashinfer-autotune \
    --mm-encoder-tp-mode data \
    --reasoning-parser qwen3 \
    --tool-call-parser qwen3_xml \
    --enable-auto-tool-choice \
    --compilation-config '{{"pass_config":{{"fuse_act_quant":true}}}}' \
    --gpu-memory-utilization {gpu_memory_utilization}
