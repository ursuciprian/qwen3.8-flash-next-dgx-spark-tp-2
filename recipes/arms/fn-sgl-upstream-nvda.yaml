# SGLang arm: upstream cookbook cell for the NVIDIA ModelOpt export (nvidia/Qwen3.8-Flash-Next-NVFP4
# fc694b54) on dev-qwen38-next-local. No --quantization (resolves to modelopt_mixed), explicit
# --moe-runner-backend flashinfer_cutlass, and the RadixArk export's MTP head as the draft model
# because the fp8 MTP experts cannot be split across two ranks. Claimed: TPOT 18.7 ms (53 tok/s)
# single-stream, GSM8K 97.0.
description: Qwen3.8-Flash-Next NVIDIA NVFP4 export on SGLang TP2 - upstream cookbook cell, RadixArk MTP head as draft
name: fn-sgl-upstream-nvda
model: nvidia/Qwen3.8-Flash-Next-NVFP4
runtime: sglang
container: lmsysorg/sglang:dev-qwen38-next-local

min_nodes: 2
max_nodes: 2

metadata:
  description: MiaAI fast-QSA candidate, adapted. Their container image is not
    published; this uses the public day-0 base with our SM121 QSA guard fix
    bind-mounted, which is the same upstream fix (sgl-project/sglang#36556).
    Network flags retargeted from their enp1s0f0np0 / rocep1s0f0 to this
    cluster's enp1s0f1np1 / rocep1s0f1 - left unchanged, NCCL would fall back
    to TCP over WiFi and cost 18-65 ms of jitter per decode step.
  model_dtype: nvfp4
  quantization: nvfp4

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 2
  gpu_memory_utilization: 0.8
  max_model_len: 110000
  max_num_seqs: 10
  served_model_name: qwen3.8-flash-next
  revision: fc694b54fb0174e0913e6adf86691ef85a4ead47
  max_total_tokens: 900000
  chunked_prefill_size: 4096
  speculative_num_steps: 3
  speculative_num_draft_tokens: 4

executor_config:
  cap_add:
    - SYS_PTRACE

env:
  PYTHONUNBUFFERED: '1'
  NCCL_SOCKET_IFNAME: enp1s0f1np1
  GLOO_SOCKET_IFNAME: enp1s0f1np1
  NCCL_IB_HCA: rocep1s0f1,roceP2p1s0f1
  NCCL_IB_DISABLE: '0'
  NCCL_IB_ROCE_VERSION_NUM: '2'
  NCCL_IB_GID_INDEX: '3'
  NCCL_NET: IB
  NCCL_NET_PLUGIN: none
  NCCL_NVLS_ENABLE: '0'
  NCCL_CUMEM_ENABLE: '0'
  NCCL_CROSS_NIC: '0'
  TORCH_CUDA_ARCH_LIST: 12.1a
  FLASHINFER_CUDA_ARCH_LIST: 12.1a

command: |
  taskset -c 5-9,15-19 python3 -m sglang.launch_server \
    --model-path {model} \
    --revision {revision} \
    --served-model-name {served_model_name} \
    --host {host} \
    --port {port} \
    --tp 2 \
    --moe-runner-backend flashinfer_cutlass \
    --fp4-gemm-backend flashinfer_cutlass \
    --page-size 64 \
    --chunked-prefill-size 4096 \
    --context-length 262144 \
    --speculative-algorithm NEXTN \
    --speculative-draft-model-path RadixArk/Qwen3.8-Flash-Next-NVFP4 \
    --speculative-draft-model-quantization modelopt_fp4 \
    --speculative-num-steps 3 \
    --speculative-eagle-topk 1 \
    --speculative-num-draft-tokens 4 \
    --max-running-requests 24 \
    --max-mamba-cache-size 120 \
    --reasoning-parser qwen3 \
    --mem-fraction-static 0.85 \
    --no-ple-offload-embedding \
    --enable-metrics \
    --enable-cache-report

recipe_version: '2'
builder: docker-pull
