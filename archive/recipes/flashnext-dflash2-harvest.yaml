description: Qwen3.8-Flash-Next NVFP4 TP=2 - feature harvest server for DFlash2 drafter training (no speculation, no radix cache, one request at a time)
name: qwen38-flash-next-nvfp4-dflash2-harvest-sglang
model: RadixArk/Qwen3.8-Flash-Next-NVFP4
runtime: sglang
container: lmsysorg/sglang:qwen38flashnext

min_nodes: 2
max_nodes: 2

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 2
  gpu_memory_utilization: 0.8
  max_model_len: 8192
  served_model_name: qwen3.8-flash-next
  revision: 7b719225242aacd3dbd3f9407468c2ee9a9d2594
  max_total_tokens: 65536
  chunked_prefill_size: 8192

executor_config:
  cap_add:
    - SYS_PTRACE
  volumes:
    - /home/nvidia/GEN-AI/qwen3.8-flash-next-dgx-spark-tp-2/patches/qsa_upstream_fix.py:/sgl-workspace/sglang/python/sglang/srt/layers/attention/qwen_sparse_attn_backend.py:ro
    - /home/nvidia/GEN-AI/qwen3.8-flash-next-dgx-spark-tp-2/training/dflash2/overlay:/overlay:ro
    - /home/nvidia/dflash2-train/features/incoming:/harvest

env:
  PYTHONUNBUFFERED: '1'
  PYTHONPATH: /overlay
  DFLASH_OVERLAY: harvest
  DFLASH_HARVEST_DIR: /harvest
  DFLASH_CAPTURE_LAYERS: 4,14,25,35,46
  DFLASH_FEATURE_MODE: mean
  NCCL_SOCKET_IFNAME: enp1s0f1np1
  GLOO_SOCKET_IFNAME: enp1s0f1np1
  NCCL_IB_HCA: rocep1s0f1,roceP2p1s0f1
  NCCL_IB_DISABLE: '0'
  NCCL_IB_ROCE_VERSION_NUM: '2'
  NCCL_IB_GID_INDEX: '3'
  NCCL_NET: IB
  NCCL_NET_PLUGIN: none
  NCCL_NVLS_ENABLE: '0'
  NCCL_CUMEM_ENABLE: '0'
  NCCL_CROSS_NIC: '0'
  TORCH_CUDA_ARCH_LIST: 12.1a
  FLASHINFER_CUDA_ARCH_LIST: 12.1a

command: |
  taskset -c 5-9,15-19 python3 -m sglang.launch_server \
    --model-path {model} \
    --revision {revision} \
    --served-model-name {served_model_name} \
    --host {host} \
    --port {port} \
    --tp-size {tensor_parallel} \
    --quantization modelopt_fp4 \
    --attention-backend flashinfer \
    --fp4-gemm-backend flashinfer_cutlass \
    --page-size 64 \
    --mamba-ssm-dtype bfloat16 \
    --mamba-radix-cache-strategy no_buffer \
    --disable-radix-cache \
    --disable-overlap-schedule \
    --mem-fraction-static {gpu_memory_utilization} \
    --context-length {max_model_len} \
    --max-total-tokens {max_total_tokens} \
    --max-running-requests 1 \
    --chunked-prefill-size {chunked_prefill_size} \
    --disable-cuda-graph \
    --ple-offload-embedding \
    --trust-remote-code

recipe_version: '1'
builder: ursuciprian
