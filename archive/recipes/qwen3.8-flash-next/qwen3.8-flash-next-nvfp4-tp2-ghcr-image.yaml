# formerly eugr-agents-serve-local16-la-ghcr.yaml
# Same as qwen3.8-flash-next-nvfp4-tp2.yaml, but points at the ghcr.io image
# assembled by spark-vllm-b12x's build-image-from-wheels.yml from the
# wheels-20260919-77bdd10-a833365 release (compile-once-publish-wheels
# pattern; see ursuciprian/spark-vllm-b12x README) instead of a local-only
# tag built by build.sh on this host. Lets any cluster host `docker pull`
# the exact same image instead of needing its own local build.sh run.

recipe_version: "1"
name: qwen3.8-flash-next-nvfp4-tp2-ghcr-image
description: "Arm 2 (la), ghcr image: same as eugr-agents-serve-local16-la, but container is the published ghcr.io/ursuciprian/spark-vllm-b12x:wheels-20260919-77bdd10-a833365 image (pull, not local build)."

model: local-inference-lab/Qwen3.8-Flash-Next-NVFP4
model_revision: 7c4f1bc1a2d6847e0cbc01ac6b823f00251de8dd
container: ghcr.io/ursuciprian/spark-vllm-b12x:wheels-20260919-77bdd10-a833365

# Empty on purpose. Any token here (including --exp-b12x) makes sparkrun's
# eugr builder either substitute its own pullable nightly or try to build via
# build-and-copy.sh (sparkrun/builders/eugr.py: _wants_build()/_wants_b12x()) --
# both wrong for a tag build.sh already built and loaded on every cluster host.
# With build_args empty and a non-sentinel tag already present on all hosts,
# sparkrun's pull-first-default branch just uses it verbatim.
build_args: []

cluster_only: true

# No mods: the ghcr image already carries the bounded-wait fix and the
# TC-45 structural-tag parser fix as source commits (b12x-startup-boundedwait
# would double-patch b12x_startup.py; run.sh's marker check makes that a
# harmless no-op skip rather than a fail-closed error, but the mod is
# redundant here and the container tag is meant to be the only difference
# from qwen3.8-flash-next-nvfp4-tp2.yaml, so it's dropped rather than kept
# as dead weight).

executor_config:
  volumes:
    - "/home/nvidia/.cache/sparkrun/runtime-cache/vllm/local-inference-lab__Qwen3.8-Flash-Next-NVFP4-ca6f25af:/tmp/.cache"

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 2
  pipeline_parallel: 1
  block_size: 16
  max_model_len: 262144
  max_num_seqs: 16
  max_num_batched_tokens: 8192
  num_speculative_tokens: 4
  gpu_memory_utilization: 0.80

env:
  B12X_AUTOTUNE: "1"
  B12X_ROCE_SPIN_LIMIT: "300000000"
  CUTE_DSL_ARCH: "sm_121a"
  SAFETENSORS_FAST_GPU: "1"
  VLLM_WORKER_MULTIPROC_METHOD: "spawn"
  VLLM_SSM_CONV_STATE_LAYOUT: "DS"
  VLLM_USE_AOT_COMPILE: "1"
  VLLM_USE_MEGA_AOT_ARTIFACT: "1"
  VLLM_USE_V2_MODEL_RUNNER: "1"
  B12X_POLICY_MODE: "auto"
  VLLM_ENABLE_ROCE_ALLREDUCE: "1"
  VLLM_ROCE_ALLREDUCE_MAX_SIZE: "2MB"

command: |
  vllm serve local-inference-lab/Qwen3.8-Flash-Next-NVFP4 \
    --revision 7c4f1bc1a2d6847e0cbc01ac6b823f00251de8dd \
    --host {host} \
    --port {port} \
    --trust-remote-code \
    --served-model-name qwen3.8-flash-next local-inference-lab/Qwen3.8-Flash-Next-NVFP4 \
    --tensor-parallel-size {tensor_parallel} \
    --pipeline-parallel-size {pipeline_parallel} \
    --mamba-cache-mode align \
    --enable-prefix-caching \
    --enable-chunked-prefill \
    --max-parallel-prefills 4 \
    --prefill-policy decode-aware \
    --decode-refill-target auto \
    --dtype bfloat16 \
    --kv-cache-dtype fp8 \
    --quantization modelopt_mixed \
    --block-size {block_size} \
    --load-format b12x \
    --max-model-len {max_model_len} \
    --max-num-seqs {max_num_seqs} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --speculative-config '{{"method":"mtp","num_speculative_tokens":{num_speculative_tokens},"use_local_argmax_reduction":true}}' \
    --gdn-decode-kernel b12x \
    --linear-backend b12x \
    --moe-backend b12x \
    --no-enable-flashinfer-autotune \
    --mm-encoder-tp-mode data \
    --reasoning-parser qwen3 \
    --tool-call-parser qwen3_xml \
    --enable-auto-tool-choice \
    --compilation-config '{{"pass_config":{{"fuse_act_quant":true}}}}' \
    --gpu-memory-utilization {gpu_memory_utilization}
