title: Qwen3.8-Flash-Next on two DGX Sparks
description: NVFP4 serving recipes for two NVIDIA DGX Spark systems (TP=2, MTP, b12x kernels), with measured throughput and a quality gate
theme: jekyll-theme-primer
plugins:
  - jekyll-relative-links
relative_links:
  enabled: true
  collections: false
include:
  - README.md
# results/ holds raw run data: Liquid-looking eval prompts ({{ ... }}) and pooled-run symlinks that point at
# paths on the Sparks, which break the Jekyll build. GitHub renders results/ from the repo tree instead.
exclude:
  - results
